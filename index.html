<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omarchy Themes</title>
<meta name="description" content="3,000+ Omarchy theme variants generated from curated wallpapers. One-click apply with Aether.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1a1b26">

<!-- Favicons (sourced from omarchy.org). The PNG ships at 300x300 so
     it works as both a tab icon and the home-screen icon. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Open Graph + Twitter card so links unfurl cleanly on Slack, Discord,
     iMessage, X, etc. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Omarchy Themes">
<meta property="og:title" content="Omarchy Themes -- apply with Aether">
<meta property="og:description" content="3,000+ Omarchy theme variants generated from curated wallpapers. One-click apply with Aether.">
<meta property="og:url" content="https://bjarneo.github.io/omarchy-themes/">
<meta property="og:image" content="https://bjarneo.github.io/omarchy-themes/favicon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Omarchy Themes -- apply with Aether">
<meta name="twitter:description" content="3,000+ Omarchy theme variants generated from curated wallpapers. One-click apply with Aether.">
<meta name="twitter:image" content="https://bjarneo.github.io/omarchy-themes/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loading" class="loader">
  <div class="state-label">LOADING<span></span></div>
  <div class="loader-panel">
    <div class="loader-head">
      <span class="loader-brand"><b>omarchy</b><span>-themes</span></span>
      <span class="loader-state"><span class="loader-spinner" aria-hidden="true"></span>loading... variants</span>
    </div>
    <div class="loader-grid" aria-hidden="true">
      <div></div><div></div><div></div><div></div>
    </div>
    <div class="loader-status">
      <span>INDEXING</span>
      <span>generating palettes...</span>
    </div>
  </div>
</div>

<main class="terminal-frame">
  <header class="glass">
    <div class="head-row">
      <div class="brand">
        <div class="brand-row">
          <img src="favicon.png" alt="Omarchy" class="brand-logo">
          <span class="brand-name"><b>omarchy</b><span>-themes</span></span>
        </div>
      </div>

      <div class="search">
        <span class="prompt" aria-hidden="true">/</span>
        <input id="q" type="search" placeholder="search themes, palettes, tags..." aria-label="Search themes" autocomplete="off" spellcheck="false">
        <span class="caret" aria-hidden="true"></span>
      </div>

      <div class="header-meta">
        <button class="fav-toggle" id="favToggle" type="button" aria-pressed="false" title="Show only favourites">
          <span class="ft-star" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span class="ft-label">favourites</span>
          <span class="fav-sep">&middot;</span>
          <span class="fav-n">0</span>
        </button>
        <div class="count-row">
          <span class="count" id="count">loading...</span>
          <span class="count-label">variants</span>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <button class="reset-btn" id="reset" title="Clear all filters (x)">
        <span>all</span>
      </button>
    <!-- Filters are populated inline by buildFilters(). -->
      <div class="filters-inline" id="filters"></div>
    </div>
  </header>

  <div class="topchrome glass">
    <div class="heatwrap" id="heatwrap">
      <canvas id="heat" role="img" aria-label="Color distribution of all theme variants"></canvas>
      <div class="heat-cursor" id="heatCursor" aria-hidden="true"></div>
      <div class="heat-tip" id="heatTip" aria-hidden="true">
        <div class="htitle" id="heatTipTitle"></div>
        <div class="hmeta" id="heatTipMeta"></div>
        <div class="hramp" id="heatTipRamp"></div>
      </div>
    </div>
  </div>
  <div class="gridwrap">
    <section class="view-state" id="viewState" hidden></section>
    <section class="featured" id="featured" aria-label="Featured themes" hidden></section>
    <div class="grid" id="grid"></div>
  </div>

  <div class="statusline">
    <span class="mode-pill" id="mode">NORMAL</span>
    <div class="crumbs" id="crumbs"></div>
    <div class="status-right">
      <span class="status-count" id="statusCount"></span>
      <span class="status-hint"><span class="kbd">/</span> search</span>
      <span class="status-hint"><span class="kbd">tab</span> focus</span>
      <span class="status-hint"><span class="kbd">&crarr;</span> open</span>
      <span class="status-hint"><span class="kbd">x</span> reset</span>
    </div>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Theme details">
  <div class="lb-panel">
    <div class="lb-chrome">
      <span class="lb-prompt" aria-hidden="true">&rsaquo;</span>
      <span>aether preview <b id="lbChromeTitle">theme</b></span>
      <button class="lb-close" id="lbclose" title="Close (esc)" aria-label="Close">esc&nbsp;&nbsp;&times;</button>
    </div>
    <div class="lb-image-wrap"></div>
    <aside class="lb-side" id="lbside"></aside>
    <div class="lb-foot">&larr;&rarr; browse&nbsp;&nbsp;&middot;&nbsp;&nbsp;f favourite&nbsp;&nbsp;&middot;&nbsp;&nbsp;y copy wallpaper URL&nbsp;&nbsp;&middot;&nbsp;&nbsp;esc close</div>
  </div>
</div>

<!-- Click-acknowledgement toast. Shown when an Apply link fires. We cannot
     observe whether the aether:// handler accepted the URL, so the toast is
     an acknowledgement of the click, not a guarantee. -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="dot" id="toast-dot"></span>
  <span><strong id="toast-title">Applying...</strong> <span class="muted" id="toast-detail"></span></span>
</div>

<script src="wallpapers.js"></script>
<script src="app.js"></script>
</body></html>
